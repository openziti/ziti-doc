name: zac-screenshots

# Regenerates a doc flow's ZAC screenshots (light and dark) and uploads them as an artifact. All logic lives in
# docusaurus/scripts/zac-screenshots/capture.ps1 so it runs the same locally; this workflow only checks out the code
# and invokes it.

on:
  workflow_dispatch:
    inputs:
      flow:
        description: Flow under docusaurus/scripts/zac-screenshots/flows
        required: true
        default: add-by-url
  # proves the harness still works when a PR changes it; runs the default flow
  pull_request:
    paths:
      - "docusaurus/scripts/zac-screenshots/**"
      - ".github/workflows/zac-screenshots.yml"

jobs:
  capture:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Capture
        shell: pwsh
        env:
          FLOW: ${{ inputs.flow || 'add-by-url' }}
        run: ./docusaurus/scripts/zac-screenshots/capture.ps1 -Flow $env:FLOW -Runtime docker -Out "$env:RUNNER_TEMP/zac-screenshots"
      - uses: actions/upload-artifact@v4
        with:
          name: zac-screenshots-${{ inputs.flow || 'add-by-url' }}
          path: ${{ runner.temp }}/zac-screenshots/*.png
          if-no-files-found: error
