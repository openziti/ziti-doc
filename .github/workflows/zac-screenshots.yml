name: zac-screenshots

# Regenerates the add-by-url lab's ZAC screenshots (light and dark) and uploads them as an artifact. All logic lives in
# docusaurus/scripts/zac-screenshots/capture.ps1 so it runs the same locally; this workflow only checks out the code
# and invokes it.

on:
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Capture
        shell: pwsh
        run: ./docusaurus/scripts/zac-screenshots/capture.ps1 -Runtime docker -Out "$env:RUNNER_TEMP/zac-screenshots"
      - uses: actions/upload-artifact@v4
        with:
          name: zac-screenshots
          path: ${{ runner.temp }}/zac-screenshots/*.png
          if-no-files-found: error
